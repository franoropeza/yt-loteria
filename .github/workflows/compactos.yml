name: Compactos de sorteos

on:
  schedule:
    # Horarios en UTC (Argentina = UTC-3). Cada sorteo dura ~25 min desde la hora:
    # se revisa a los 35, 55 y 80 min. GitHub puede demorar los cron programados unos minutos.
    - cron: "35,55 15,18,21 * * *"   # 12:00, 15:00 y 18:00 ART
    - cron: "20 16,19,22 * * *"
    - cron: "35,55 0 * * *"          # 21:00 ART
    - cron: "20 1 * * *"
    - cron: "5,25,50 2 * * *"        # 22:30 ART
  workflow_dispatch:
    inputs:
      vod:
        description: "ID de un VOD puntual (vacío = buscar nuevos)"
        required: false
      sin_subir:
        description: "Armar sin subir a YouTube"
        type: boolean
        default: false

concurrency:
  group: compactos
  cancel-in-progress: false

permissions:
  contents: write   # para guardar estado/procesados.json y cronograma.csv en el repo

env:
  TWITCH_CANAL: ${{ vars.TWITCH_CANAL }}
  PYTHONIOENCODING: utf-8

jobs:
  detectar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pendientes: ${{ steps.detectar.outputs.pendientes }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yt-dlp>=2026.8.19"
      - id: detectar
        env:
          VOD: ${{ inputs.vod }}
        run: |
          if [ -n "$VOD" ]; then echo "pendientes=true" >> "$GITHUB_OUTPUT"
          else python procesar.py --solo-detectar; fi

  procesar:
    needs: detectar
    if: needs.detectar.outputs.pendientes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Instalar FFmpeg y Tesseract
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg tesseract-ocr
      - run: pip install -r requirements.txt
      - name: Cache del modelo de Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Procesar VODs
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_PRIVACIDAD: ${{ vars.YT_PRIVACIDAD || 'private' }}
          YT_PLAYLISTS: ${{ vars.YT_PLAYLISTS || '{}' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          VOD: ${{ inputs.vod }}
          SIN_SUBIR: ${{ inputs.sin_subir }}
        run: |
          ARGS=()
          [ -n "$VOD" ] && ARGS+=(--vod "$VOD")
          [ "$SIN_SUBIR" = "true" ] && ARGS+=(--sin-subir)
          python procesar.py "${ARGS[@]}"
      - name: Guardar estado en el repo
        if: always()
        run: |
          git config user.name "compactos-bot"
          git config user.email "compactos-bot@users.noreply.github.com"
          git add estado/ cronograma.csv
          git diff --cached --quiet || (git commit -m "Estado de compactos $(date -u +%F' '%H:%M)" && git push)
      - name: Guardar compactos armados (7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compactos-${{ github.run_id }}
          path: salida/
          retention-days: 7
          if-no-files-found: ignore
