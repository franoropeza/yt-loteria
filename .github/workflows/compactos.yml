name: Compactos de sorteos

on:
  # Las corridas las dispara cron-job.org (zona America/Argentina/Salta) llamando a la API
  # .../actions/workflows/compactos.yml/dispatches: el cron propio de GitHub no disparaba a horario.
  #   22,27,32,40,55 12,15,18,21 * * *   revisiones de los sorteos de 12, 15, 18 y 21 h (el vivo dura ~20 min)
  #   20 13,16,19,22 * * *               última revisión (80 min): aviso de sorteo sin VOD y respaldo
  #   52,57 22 * * *  +  2,10,25,50 23 * * *   La Revancha (22:30)
  workflow_dispatch:
    inputs:
      vod:
        description: "ID de un VOD puntual (vacío = buscar nuevos)"
        required: false
      cabeza:
        description: "Con VOD: minuto del VOD en que sale la cabeza, MM:SS (para VODs sin audio)"
        required: false
      respaldo:
        description: "Compacto de respaldo con el extracto oficial de un sorteo: DD/MM/AAAA HH:MM"
        required: false
      sin_subir:
        description: "Armar sin subir a YouTube"
        type: boolean
        default: false

concurrency:
  group: compactos
  cancel-in-progress: false

permissions:
  contents: write   # para guardar cronograma.csv en el repo (el estado va al repo privado <repo>-estado)

env:
  TWITCH_CANAL: ${{ vars.TWITCH_CANAL }}
  PYTHONIOENCODING: utf-8

jobs:
  detectar:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      pendientes: ${{ steps.detectar.outputs.pendientes }}
    steps:
      # ref main: con workflow_dispatch el SHA queda fijo al momento del disparo; si la corrida
      # estuvo en cola detrás de otra, sin esto no ve el estado que esa otra acaba de guardar.
      - uses: actions/checkout@v4
        with:
          ref: main
      # estado/procesados.json vive en un repo privado aparte (este repo es público). Deploy key con escritura.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-estado
          ssh-key: ${{ secrets.ESTADO_DEPLOY_KEY }}
          path: estado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install "yt-dlp>=2026.8.19"
      - id: detectar
        env:
          VOD: ${{ inputs.vod }}
          RESPALDO: ${{ inputs.respaldo }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          if [ -n "$VOD$RESPALDO" ]; then echo "pendientes=true" >> "$GITHUB_OUTPUT"
          else python procesar.py --solo-detectar; fi
      - name: Avisar por Telegram si la corrida falló
        if: failure()
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -sS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=❌ Falló la corrida de compactos (detección). Ver el detalle: $URL"

  procesar:
    needs: detectar
    if: needs.detectar.outputs.pendientes == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # estado/procesados.json vive en un repo privado aparte (este repo es público). Deploy key con escritura.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-estado
          ssh-key: ${{ secrets.ESTADO_DEPLOY_KEY }}
          path: estado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      # En horas pico los espejos de Ubuntu llegaron a tardar 45 min en apt-get update + descarga: los .deb quedan
      # en caché (por versión de imagen del runner, con restore-keys para reusar los de la imagen anterior) y se
      # instalan sin red. Si no alcanzan (imagen nueva con otras dependencias), se bajan de nuevo y se re-cachean.
      - id: imagen
        run: echo "version=$ImageVersion" >> "$GITHUB_OUTPUT"
      - name: Cache de paquetes de FFmpeg y Tesseract
        uses: actions/cache@v4
        with:
          path: ~/apt-debs
          key: apt-ffmpeg-tesseract-v1-${{ steps.imagen.outputs.version }}
          restore-keys: apt-ffmpeg-tesseract-v1-
      # Un apt colgado (espejo lento, lock de dpkg) llegó a trabar la corrida 40+ min y, por la concurrencia,
      # a cancelar todas las corridas de la cola (11/11/2026, Matutina). Se corta a los 10 min y se reintenta
      # una vez desde cero; si el reintento también falla, la corrida falla y avisa por Telegram.
      - name: Instalar FFmpeg y Tesseract
        id: instalar
        timeout-minutes: 10
        continue-on-error: true
        run: |
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts
          if ls ~/apt-debs/*.deb > /dev/null 2>&1 && sudo apt-get install -y -qq --no-download ~/apt-debs/*.deb; then
            exit 0
          fi
          rm -rf ~/apt-debs && mkdir -p ~/apt-debs/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$HOME/apt-debs" ffmpeg tesseract-ocr
          sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
          sudo chown -R "$USER" ~/apt-debs
      - name: Instalar FFmpeg y Tesseract (reintento)
        if: steps.instalar.outcome == 'failure'
        timeout-minutes: 10
        run: |
          sudo killall -q apt-get dpkg || true
          sudo dpkg --configure -a || true
          # El 11/11/2026 el runner no resolvía azure.archive.ubuntu.com (espejo por defecto): usar los oficiales.
          printf 'http://archive.ubuntu.com/ubuntu/\tpriority:1\nhttp://us.archive.ubuntu.com/ubuntu/\tpriority:2\n' | sudo tee /etc/apt/apt-mirrors.txt
          echo 'Acquire::Retries "3"; Acquire::http::Timeout "30";' | sudo tee /etc/apt/apt.conf.d/99timeouts
          if ls ~/apt-debs/*.deb > /dev/null 2>&1 && sudo apt-get install -y -qq --no-download ~/apt-debs/*.deb; then
            exit 0
          fi
          rm -rf ~/apt-debs && mkdir -p ~/apt-debs/partial
          sudo apt-get update -qq
          sudo apt-get install -y -qq -o Dir::Cache::archives="$HOME/apt-debs" ffmpeg tesseract-ocr
          sudo rm -rf ~/apt-debs/partial ~/apt-debs/lock
          sudo chown -R "$USER" ~/apt-debs
      - run: pip install -r requirements.txt
      - name: Cache del modelo de Whisper
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: whisper-small-v1
      - name: Procesar VODs
        id: procesar
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_PRIVACIDAD: ${{ vars.YT_PRIVACIDAD || 'private' }}
          YT_PLAYLIST: ${{ vars.YT_PLAYLIST || 'PLQw-MqYiPuUc' }}
          YT_PLAYLISTS: ${{ vars.YT_PLAYLISTS || '{}' }}
          FB_ACTIVO: ${{ vars.FB_ACTIVO || 'false' }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PUBLICAR: ${{ vars.FB_PUBLICAR || 'false' }}
          FB_SORTEOS: ${{ vars.FB_SORTEOS || 'VESPERTINA,NOCTURNA' }}
          FB_ENDPOINT: ${{ vars.FB_ENDPOINT || 'reels' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL_TOKEN: ${{ secrets.TELEGRAM_CANAL_TOKEN }}
          TELEGRAM_CANAL_CHAT_ID: ${{ secrets.TELEGRAM_CANAL_CHAT_ID || vars.TELEGRAM_CANAL_CHAT_ID }}
          TERMINOS_RIESGO: ${{ secrets.TERMINOS_RIESGO }}
          LOTERIA_API_EXTRACTO: ${{ secrets.LOTERIA_API_EXTRACTO }}
          VOD: ${{ inputs.vod }}
          CABEZA: ${{ inputs.cabeza }}
          RESPALDO: ${{ inputs.respaldo }}
          SIN_SUBIR: ${{ inputs.sin_subir }}
        run: |
          ARGS=()
          [ -n "$VOD" ] && ARGS+=(--vod "$VOD")
          [ -n "$CABEZA" ] && ARGS+=(--cabeza "$CABEZA")
          [ -n "$RESPALDO" ] && ARGS+=(--respaldo "$RESPALDO")
          [ "$SIN_SUBIR" = "true" ] && ARGS+=(--sin-subir)
          python procesar.py "${ARGS[@]}" || { c=$?; echo "codigo=$c" >> "$GITHUB_OUTPUT"; exit $c; }
      - name: Guardar estado
        if: always()
        run: |
          git config user.name "compactos-bot"
          git config user.email "compactos-bot@users.noreply.github.com"
          git add cronograma.csv
          git diff --cached --quiet || (git commit -m "Cronograma $(date -u +%F' '%H:%M)" && { git push || { git pull --rebase && git push; }; })
          (cd estado && git add -A && { git diff --cached --quiet || { git -c user.name=compactos-bot -c user.email=compactos-bot@users.noreply.github.com commit -qm "Estado de compactos $(date -u +%F' '%H:%M)" && { git push || { git pull --rebase && git push; }; }; }; })
      - name: Guardar compactos armados (7 días)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: compactos-${{ github.run_id }}
          path: salida/
          retention-days: 7
          if-no-files-found: ignore
      - name: Avisar por Telegram si la corrida falló
        if: failure() && steps.procesar.outputs.codigo != '3'  # 3 = fallas ya avisadas por procesar.py
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          [ -n "$TELEGRAM_TOKEN" ] || exit 0
          curl -sS -o /dev/null "https://api.telegram.org/bot$TELEGRAM_TOKEN/sendMessage"             --data-urlencode "chat_id=$TELEGRAM_CHAT_ID"             --data-urlencode "text=❌ Falló la corrida de compactos (procesamiento). Ver el detalle: $URL"

  # Comparte el enlace de YouTube de los compactos que ya están públicos: en Facebook (sorteos que no van como video)
  # y en el canal de Telegram (todos). Ver compartir.py. Corre siempre, haya habido VODs o no: el video puede pasar a
  # público a mano entre una corrida y otra.
  compartir:
    needs: [detectar, procesar]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      # estado/procesados.json vive en un repo privado aparte (este repo es público). Deploy key con escritura.
      - uses: actions/checkout@v4
        with:
          repository: ${{ github.repository }}-estado
          ssh-key: ${{ secrets.ESTADO_DEPLOY_KEY }}
          path: estado
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install google-api-python-client==2.201.0 google-auth==2.62.0
      - name: Compartir enlaces pendientes
        env:
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          FB_ACTIVO: ${{ vars.FB_ACTIVO || 'false' }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PUBLICAR: ${{ vars.FB_PUBLICAR || 'false' }}
          FB_SORTEOS: ${{ vars.FB_SORTEOS || 'VESPERTINA,NOCTURNA' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL_TOKEN: ${{ secrets.TELEGRAM_CANAL_TOKEN }}
          TELEGRAM_CANAL_CHAT_ID: ${{ secrets.TELEGRAM_CANAL_CHAT_ID || vars.TELEGRAM_CANAL_CHAT_ID }}
        run: python compartir.py
      - name: Guardar estado
        run: |
          (cd estado && git add -A && { git diff --cached --quiet || { git -c user.name=compactos-bot -c user.email=compactos-bot@users.noreply.github.com commit -qm "Enlaces compartidos $(date -u +%F' '%H:%M)" && { git push || { git pull --rebase && git push; }; }; }; })
