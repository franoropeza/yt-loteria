name: Estado de una publicación en Facebook

# Diagnóstico a mano: qué dice la Graph API de un enlace compartido (publicación, visibilidad) y del muro de la página
on:
  workflow_dispatch:
    inputs:
      post_id:
        description: "ID de la publicación (facebook.post_id en estado/procesados.json)"
        required: true

permissions:
  contents: read

jobs:
  publicacion:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar la API
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
          POST_ID: ${{ inputs.post_id }}
        run: python facebook.py publicacion "$POST_ID"
