name: Estado de un video en Facebook

# Diagnóstico a mano: qué dice la Graph API de un video subido (procesamiento, publicación, privacidad)
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video de Facebook (está en el estado de compactos); vacío = probar la subida por Reels con un clip en borrador"
        required: false

permissions:
  contents: read

jobs:
  estado:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Instalar FFmpeg (para la prueba de subida)
        if: inputs.video_id == ''
        run: sudo apt-get update -qq && sudo apt-get install -y -qq ffmpeg
      - name: Consultar la API
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
          VIDEO_ID: ${{ inputs.video_id }}
        run: |
          if [ -n "$VIDEO_ID" ]; then python facebook.py estado "$VIDEO_ID"; else python facebook.py probar; fi
