name: Estado de un video en Facebook

# Diagnóstico a mano: qué dice la Graph API de un video subido (procesamiento, publicación, privacidad)
on:
  workflow_dispatch:
    inputs:
      video_id:
        description: "ID del video de Facebook (está en estado/procesados.json)"
        required: true

permissions:
  contents: read

jobs:
  estado:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Consultar la API
        env:
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          PYTHONIOENCODING: utf-8
          VIDEO_ID: ${{ inputs.video_id }}
        run: python facebook.py estado "$VIDEO_ID"
