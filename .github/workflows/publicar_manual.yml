# Publica un compacto armado a mano (por ejemplo, un VOD sin sonido armado con armar_compacto.armar y una
# transcripción sintética). El .mp4, el .jpg y el .json de armar() se suben antes a un release del repo:
#   gh release create manual-<vod> compacto_X.mp4 compacto_X.jpg compacto_X.json
# y se corre este workflow con el tag y el VOD. Usa publicar() de procesar.py, igual que un compacto normal.
name: Publicar compacto manual

on:
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag del release con el .mp4, .jpg y .json del compacto"
        required: true
      vod:
        description: "ID del VOD al que corresponde (para estado/procesados.json)"
        required: true

concurrency:
  group: compactos
  cancel-in-progress: false

jobs:
  publicar:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: pip install -r requirements.txt
      - name: Bajar el compacto
        env:
          GH_TOKEN: ${{ github.token }}
        run: mkdir -p salida && gh release download "${{ inputs.tag }}" -D salida
      - name: Publicar
        env:
          TWITCH_CANAL: ${{ vars.TWITCH_CANAL }}
          PYTHONIOENCODING: utf-8
          YT_TOKEN_JSON: ${{ secrets.YT_TOKEN_JSON }}
          YT_PRIVACIDAD: ${{ vars.YT_PRIVACIDAD || 'private' }}
          YT_PLAYLIST: ${{ vars.YT_PLAYLIST || 'PLQw-MqYiPuUc' }}
          YT_PLAYLISTS: ${{ vars.YT_PLAYLISTS || '{}' }}
          FB_ACTIVO: ${{ vars.FB_ACTIVO || 'false' }}
          FB_PAGE_ID: ${{ vars.FB_PAGE_ID }}
          FB_PAGE_TOKEN: ${{ secrets.FB_PAGE_TOKEN }}
          FB_PUBLICAR: ${{ vars.FB_PUBLICAR || 'false' }}
          FB_SORTEOS: ${{ vars.FB_SORTEOS || 'VESPERTINA,NOCTURNA' }}
          FB_ENDPOINT: ${{ vars.FB_ENDPOINT || 'reels' }}
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_CANAL_TOKEN: ${{ secrets.TELEGRAM_CANAL_TOKEN }}
          TELEGRAM_CANAL_CHAT_ID: ${{ secrets.TELEGRAM_CANAL_CHAT_ID || vars.TELEGRAM_CANAL_CHAT_ID }}
          VOD: ${{ inputs.vod }}
        run: |
          python - <<'EOF'
          import datetime as dt, json, os
          from pathlib import Path
          import config, procesar
          meta = next(Path("salida").glob("*.json"))
          info = json.loads(meta.read_text(encoding="utf-8"))
          info["compacto"], info["miniatura"] = str(meta.with_suffix(".mp4")), str(meta.with_suffix(".jpg"))
          registro = procesar.publicar(info, True)
          estado = procesar.cargar_estado()
          previo = estado.get(os.environ["VOD"], {})
          estado[os.environ["VOD"]] = {**registro, "manual": True, "titulo_twitch": previo.get("titulo_twitch", ""),
                                       "actualizado": dt.datetime.now(config.ARG).isoformat(timespec="seconds")}
          procesar.guardar_estado(estado)
          print(json.dumps(registro, ensure_ascii=False, indent=2))
          EOF
      - name: Guardar estado en el repo
        if: always()
        run: |
          git config user.name "compactos-bot"
          git config user.email "compactos-bot@users.noreply.github.com"
          git add estado/
          git diff --cached --quiet || (git commit -m "Compacto manual ${{ inputs.vod }}" && { git push || { git pull --rebase && git push; }; })
